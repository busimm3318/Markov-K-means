[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "markov-kmeans"
version = "0.1.0"
description = "Markov-K-means: stop K-means when only a few points still move and settle them with the Markov chain of their label history"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "numba", "scikit-learn", "threadpoolctl"]

[project.optional-dependencies]
dev = ["pytest", "pandas", "matplotlib"]

[tool.setuptools.packages.find]
include = ["markov_kmeans*", "kmeans_accel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
